<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Form</title>
    <link rel="stylesheet" href="capture.css">
</head>
<body>

<div class="container">
    <div class="left">
        <h2>PUPASSURE</h2>

        <div class="dog">
            <img src="./Dog.png">
        </div>
    </div>
    <div class="right">

        <h1>Yay, puppies! Ensure your pup gets the best care!</h1>

        <div class="row">
            <div class="box">
                <label>Name</label>
                <input type="text" placeholder="Pet's name">
            </div>

            <div class="box">
                <label>Upload Photo</label>
                <input type="file">
            </div>
        </div>

        <div class="row">
            <div class="box">
                <label>Breed</label>
                <input type="text" placeholder="Pet's breed">
            </div>

            <div class="box">
                <label>Birthday</label>
                <input type="date">
            </div>
        </div>

        <div class="row">
            <div class="box">
                <label>Gender</label>

                <div class="buttons">
                    <button>Female</button>
                    <button>Male</button>
                </div>
            </div>

            <div class="box">
                <label>Spayed / Neutered</label>

                <div class="buttons">
                    <button>Spayed</button>
                    <button>Neutered</button>
                </div>
            </div>
        </div>

        <div class="box">
            <label>Weight</label>

            <div class="buttons">
                <button>0-25 lbs</button>
                <button>25-50 lbs</button>
                <button>50-100 lbs</button>
                <button>100+ lbs</button>
            </div>
        </div>

        <div class="footer">
            <button class="back">Back</button>
            <button class="next">Next</button>
        </div>

    </div>

</div>

</body>
</html>
